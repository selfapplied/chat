name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    name: Lint and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.12.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm lint

      - name: Build application
        run: |
          # Use 'next build' directly instead of 'pnpm build' to skip database migration
          # (pnpm build runs 'tsx lib/db/migrate && next build')
          # Database migrations are handled by Vercel during deployment
          pnpm exec next build
        env:
          # Mock environment variables needed for build
          AUTH_SECRET: mock-secret-for-ci-build
          POSTGRES_URL: postgresql://mock:mock@localhost:5432/mock

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    # Only run tests if lint-and-build passes
    needs: lint-and-build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.12.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright tests
        run: pnpm test
        env:
          CI: true
          # Mock environment variables needed for tests
          AUTH_SECRET: mock-secret-for-ci-tests
          POSTGRES_URL: postgresql://mock:mock@localhost:5432/mock

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
